[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-gatekeeper"
version = "0.1.0"
description = "Pre-flight security audit for MCP client configs and server tool manifests. Offline and deterministic."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vishal Sharma" }]
keywords = ["mcp", "model-context-protocol", "security", "audit", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Security",
    "Intended Audience :: Developers",
]
dependencies = ["PyYAML>=5.4"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
mcp-gatekeeper = "mcp_gatekeeper.cli:main"

[tool.setuptools]
packages = ["mcp_gatekeeper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
